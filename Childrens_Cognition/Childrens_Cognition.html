<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
  <title>Children's Cognition</title>
  <meta name="description" content="Children's Cognition – mobile-friendly PDF viewer powered by PDF.js" />
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #57606a;
      --border: #d0d7de;
      --accent: #0969da;
      --toolbar-h: 56px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
    }

    /* ── Toolbar ── */
    #toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      height: var(--toolbar-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      gap: 0.5rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    #toolbar h1 {
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.4rem 0.7rem;
      font-size: 0.9rem;
      color: var(--text);
      cursor: pointer;
      min-width: 36px;
      min-height: 36px;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    .btn:hover { background: #e6e8eb; }
    .btn:disabled { opacity: 0.4; cursor: default; }

    #page-info {
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ── Zoom controls ── */
    #zoom-select {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.4rem 0.5rem;
      font-size: 0.85rem;
      background: var(--bg);
      color: var(--text);
      height: 36px;
    }

    /* ── Canvas viewer ── */
    #viewer {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.25rem 0.75rem 3rem;
      gap: 1rem;
    }

    .page-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
      width: 100%;
      max-width: 860px;
    }

    .page-label {
      font-size: 0.75rem;
      color: var(--muted);
      padding: 0.4rem 0.75rem;
      border-bottom: 1px solid var(--border);
      background: #fafafa;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ── Loading / error states ── */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1rem;
      gap: 1rem;
      color: var(--muted);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #error-msg {
      display: none;
      margin: 2rem auto;
      max-width: 520px;
      background: #fff0f0;
      border: 1px solid #f5c2c7;
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      color: #842029;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* ── Single-page mode ── */
    #single-view {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0.75rem 3rem;
    }
    #single-view canvas {
      max-width: 860px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,.1);
      border: 1px solid var(--border);
    }

    /* ── Mode toggle ── */
    #mode-toggle {
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <h1>Children's Cognition</h1>
    <div class="nav-group">
      <button class="btn" id="btn-prev" title="Previous page" disabled>‹</button>
      <span id="page-info">— / —</span>
      <button class="btn" id="btn-next" title="Next page" disabled>›</button>
    </div>
    <div class="nav-group">
      <select id="zoom-select" title="Zoom">
        <option value="auto" selected>Auto</option>
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
      </select>
      <button class="btn" id="mode-toggle" title="Toggle view mode">☰ All</button>
    </div>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <p>Loading PDF…</p>
  </div>

  <div id="error-msg">
    <strong>Could not load the PDF.</strong><br>
    Make sure <code>Childrens_Cognition.pdf</code> is in the same folder as this HTML file, then open it via a web server (not <code>file://</code>).
    <br><br>
    On iPhone/iPad you can share the PDF directly from Files or use a cloud link.
  </div>

  <!-- All-pages scroll view -->
  <div id="viewer"></div>

  <!-- Single-page view -->
  <div id="single-view">
    <canvas id="single-canvas"></canvas>
  </div>

  <!-- PDF.js from CDN (works on all browsers including iOS Safari) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const PDF_URL = './Childrens_Cognition.pdf';

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ── State ──
    let pdfDoc = null;
    let totalPages = 0;
    let currentPage = 1;
    let zoom = 'auto';
    let singleMode = false;

    const viewer      = document.getElementById('viewer');
    const singleView  = document.getElementById('single-view');
    const singleCanvas= document.getElementById('single-canvas');
    const loading     = document.getElementById('loading');
    const errorMsg    = document.getElementById('error-msg');
    const pageInfo    = document.getElementById('page-info');
    const btnPrev     = document.getElementById('btn-prev');
    const btnNext     = document.getElementById('btn-next');
    const zoomSelect  = document.getElementById('zoom-select');
    const modeToggle  = document.getElementById('mode-toggle');

    // ── Helpers ──
    function getScale(viewport) {
      if (zoom !== 'auto') return parseFloat(zoom);
      const maxW = Math.min(window.innerWidth - 32, 860);
      return maxW / viewport.width;
    }

    function updateNav() {
      pageInfo.textContent = `${currentPage} / ${totalPages}`;
      btnPrev.disabled = currentPage <= 1;
      btnNext.disabled = currentPage >= totalPages;
    }

    // ── Render one page into a given canvas ──
    async function renderPage(pageNum, canvas) {
      const page = await pdfDoc.getPage(pageNum);
      const vp   = page.getViewport({ scale: 1 });
      const scale = getScale(vp);
      const scaledVp = page.getViewport({ scale });

      const dpr = window.devicePixelRatio || 1;
      canvas.width  = scaledVp.width  * dpr;
      canvas.height = scaledVp.height * dpr;
      canvas.style.width  = scaledVp.width  + 'px';
      canvas.style.height = scaledVp.height + 'px';

      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      await page.render({ canvasContext: ctx, viewport: scaledVp }).promise;
    }

    // ── Render all pages (scroll mode) ──
    async function renderAll() {
      viewer.innerHTML = '';
      const renders = [];
      for (let i = 1; i <= totalPages; i++) {
        const wrap = document.createElement('div');
        wrap.className = 'page-wrap';

        const label = document.createElement('div');
        label.className = 'page-label';
        label.textContent = `Page ${i} of ${totalPages}`;
        wrap.appendChild(label);

        const canvas = document.createElement('canvas');
        wrap.appendChild(canvas);
        viewer.appendChild(wrap);

        renders.push(renderPage(i, canvas));
      }
      await Promise.all(renders);
    }

    // ── Render single page ──
    async function renderSingle(num) {
      currentPage = Math.max(1, Math.min(num, totalPages));
      updateNav();
      await renderPage(currentPage, singleCanvas);
    }

    // ── Switch modes ──
    function setMode(single) {
      singleMode = single;
      if (single) {
        viewer.style.display = 'none';
        singleView.style.display = 'flex';
        modeToggle.textContent = '☰ All';
        renderSingle(currentPage);
      } else {
        viewer.style.display = 'flex';
        singleView.style.display = 'none';
        modeToggle.textContent = '❐ Single';
        renderAll();
      }
    }

    // ── Load PDF ──
    pdfjsLib.getDocument(PDF_URL).promise.then(pdf => {
      pdfDoc    = pdf;
      totalPages = pdf.numPages;
      loading.style.display = 'none';
      viewer.style.display = 'flex';
      updateNav();
      renderAll();
    }).catch(err => {
      loading.style.display = 'none';
      errorMsg.style.display = 'block';
      console.error('PDF load error:', err);
    });

    // ── Controls ──
    btnPrev.addEventListener('click', () => {
      if (singleMode) renderSingle(currentPage - 1);
      else {
        currentPage = Math.max(1, currentPage - 1);
        const el = viewer.querySelectorAll('.page-wrap')[currentPage - 1];
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        updateNav();
      }
    });

    btnNext.addEventListener('click', () => {
      if (singleMode) renderSingle(currentPage + 1);
      else {
        currentPage = Math.min(totalPages, currentPage + 1);
        const el = viewer.querySelectorAll('.page-wrap')[currentPage - 1];
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        updateNav();
      }
    });

    zoomSelect.addEventListener('change', () => {
      zoom = zoomSelect.value;
      if (singleMode) renderSingle(currentPage);
      else renderAll();
    });

    modeToggle.addEventListener('click', () => setMode(!singleMode));

    // ── Track scroll position to update page indicator in all-pages mode ──
    const observer = new IntersectionObserver(entries => {
      if (singleMode) return;
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const wraps = Array.from(viewer.querySelectorAll('.page-wrap'));
          const idx = wraps.indexOf(entry.target);
          if (idx !== -1) { currentPage = idx + 1; updateNav(); }
        }
      });
    }, { threshold: 0.5 });

    const observePages = () => {
      viewer.querySelectorAll('.page-wrap').forEach(el => observer.observe(el));
    };

    // Re-observe after renders
    const origRenderAll = renderAll;
    renderAll = async () => { await origRenderAll(); observePages(); };
  </script>
</body>
</html>
